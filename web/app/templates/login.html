{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Admin login</h1>
  <p>Sign in with the Telegram account listed in <code>ADMIN_IDS</code>.</p>
  <script async src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="{{ bot_username }}" data-size="large"
          data-auth-url="/login/callback" data-request-access="write"></script>
  <noscript><p>JavaScript is required for the Telegram login button.</p></noscript>
</section>
{% endblock %}

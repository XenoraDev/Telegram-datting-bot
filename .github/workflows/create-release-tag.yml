# Creates ONE annotated release tag. Manual only; there is no other trigger.
#
# Why: release.sh needs an ANNOTATED tag. A tag made in the GitHub web UI is lightweight, and the
# Claude Code session cannot push tags. This workflow uses the repository's own GITHUB_TOKEN.
# See docs/RELEASE_RUNBOOK.md ("Creating the release tag") and scripts/create_release_tag.sh.
name: Create release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.0.0-rc2 or v2.0.0 (must not exist yet)"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit id the tag must point to (must be on release/v2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Validate only: write nothing. Run once with this on, then again with it off."
        required: true
        type: boolean
        default: true

# No permissions by default; the single job asks for exactly what it needs.
permissions: {}

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    # The workflow file that runs must be the one on the release branch, never a copy from a
    # feature branch, so nobody can dispatch a modified workflow to create a tag.
    if: github.ref == 'refs/heads/release/v2.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed only for POST git/tags and POST git/refs (creating the tag)
    steps:
      - name: Check out the full history of the release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
          fetch-tags: true

      # The inputs go in through the environment, never interpolated into the script text.
      - name: Validate, create and verify the annotated tag
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/v2.0.0
        run: |
          set -euo pipefail
          args=(--tag "$TAG" --expected-sha "$EXPECTED_SHA")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--validate-only); fi
          bash scripts/create_release_tag.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

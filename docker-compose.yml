# PostgreSQL + bot (always). The bot talks to Telegram via long polling, so it needs no published
# ports and no domain.
# P5 web admin = the "web" service, behind the "web" profile so the bot keeps deploying exactly as
# before until you opt in:   docker compose --profile web up -d --build web
# HTTPS is terminated by the host's existing Apache (aaPanel), which proxies to 127.0.0.1:8000;
# this stack publishes nothing publicly (web: loopback only, db: nothing).
name: dating-bot

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    # No "ports:" on purpose: the database is reachable only from other containers.

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # The bot builds (and percent-encodes) its connection URL from POSTGRES_* in .env.
      # Blank on purpose: ignores any DATABASE_URL left in .env, so compose always talks to "db".
      DATABASE_URL: ""
      POSTGRES_HOST: db
    networks: [internal]

  web:
    profiles: [web]
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
    networks: [internal]
    # Loopback only: the host's Apache (aaPanel) proxies admin-bot.<domain> to this port and
    # terminates HTTPS. 127.0.0.1 is not reachable from the internet. Never bind all interfaces here.
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8000}:8000"

  # Load-test worker: TESTING ENVIRONMENT ONLY (see docs/LOAD_TESTING.md). Off unless the
  # "loadtest" profile is enabled; it refuses to run unless the environment proves it is a test
  # environment, and it only executes jobs confirmed in Telegram. Use a separate project and
  # .env file:  docker compose -p dating-bot-loadtest --env-file .env.loadtest --profile loadtest ...
  loadtest-worker:
    profiles: [loadtest]
    build:
      context: .
      target: bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
    command: ["python", "-m", "bot.loadtest.worker"]
    healthcheck:
      disable: true
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}

# PostgreSQL + bot (always). The bot talks to Telegram via long polling, so it needs no published
# ports and no domain.
# P5 web admin = the "web" + "caddy" services, behind the "web" profile so the bot keeps deploying
# exactly as before until you opt in:   docker compose --profile web up -d --build
# (or put COMPOSE_PROFILES=web in .env). Only caddy publishes ports (80/443); web and db never do.
name: dating-bot

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    # No "ports:" on purpose: the database is reachable only from other containers.

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # The bot builds (and percent-encodes) its connection URL from POSTGRES_* in .env.
      # Blank on purpose: ignores any DATABASE_URL left in .env, so compose always talks to "db".
      DATABASE_URL: ""
      POSTGRES_HOST: db
    networks: [internal]

  web:
    profiles: [web]
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
    networks: [internal]
    # No "ports:" on purpose: only caddy (same network) can reach port 8000.

  caddy:
    profiles: [web]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Empty (not an error) when unset, so the bot still deploys without the web settings;
      # Caddy then refuses to start instead of serving a wrong site.
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
